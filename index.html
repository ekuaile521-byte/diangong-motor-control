<style>
*{box-sizing:border-box}
body{font-family:"Microsoft YaHei","PingFang SC","Noto Sans CJK SC",sans-serif;margin:0;background:#f3f5f7;color:#111;line-height:1.7}
header{background:#0b5d3b;color:#fff;padding:14px 18px}
header h1{margin:0;font-size:22px}
.tools{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px;align-items:center}
.tools button,.tools a{font-size:15px;padding:7px 14px;border-radius:20px;border:1px solid #fff;background:#fff;color:#0b5d3b;text-decoration:none;cursor:pointer}
.tools button.off{background:transparent;color:#fff}
.tools button:disabled{opacity:.5;cursor:default}
nav{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;background:#fff;border-bottom:1px solid #d5d9dd;position:sticky;top:0;z-index:5}
nav button{font-size:14px;padding:6px 10px;border:1px solid #c9ced3;background:#fff;border-radius:8px;cursor:pointer;color:#222}
nav button.on{background:#0b5d3b;color:#fff;border-color:#0b5d3b}
main{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(300px,1fr);gap:14px;padding:12px;max-width:1500px;margin:0 auto}
.stage{position:relative;background:#fff;border:1px solid #c9ced3;border-radius:8px;overflow:hidden;touch-action:manipulation}
.stage img{display:block;width:100%;height:auto;user-select:none;-webkit-user-drag:none}
.stage .hot{position:absolute;transform:translate(-50%,-50%);border-radius:50%;background:transparent;border:0;padding:0;cursor:pointer}
.stage .hot:focus-visible{outline:3px solid #0b5d3b}
.stage .hot:hover{background:rgba(11,93,59,.16)}
.ring{position:absolute;width:58px;height:58px;border:4px solid #0b5d3b;border-radius:50%;transform:translate(-50%,-50%);pointer-events:none;display:none;box-shadow:0 0 0 3px #fff}
.ring.on{display:block;animation:pulse 1s ease-out 2}
@keyframes pulse{0%{transform:translate(-50%,-50%) scale(.6);opacity:1}100%{transform:translate(-50%,-50%) scale(1.5);opacity:0}}
.hint{font-size:14px;color:#555;margin:8px 2px 0}
.panel{background:#fff;border:1px solid #c9ced3;border-radius:8px;padding:14px;align-self:start}
.now{min-height:190px;background:#fff8dc;border:1px solid #e6d98a;border-radius:8px;padding:12px 14px}
#now-name{font-size:20px;font-weight:bold;color:#0b5d3b;margin-bottom:6px}
#now-text{font-size:18px}
.panel h3{font-size:15px;margin:16px 0 6px;color:#555}
.panel ol,.panel ul{margin:0;padding-left:0;list-style:none}
.panel li button{display:block;width:100%;text-align:left;font-size:15px;line-height:1.5;padding:6px 8px;border:0;background:transparent;cursor:pointer;border-radius:6px;color:#111}
.panel li button:hover{background:#eef3f0}
.panel li button.on{background:#0b5d3b;color:#fff}
.panel li button b{display:inline-block;min-width:24px;text-align:center;background:#ffe13c;color:#000;border-radius:50%;margin-right:6px;font-size:13px;padding:1px 0}
.sw{display:inline-block;width:26px;height:6px;border-radius:3px;margin-right:8px;vertical-align:middle}
.wire{border-top:1px dashed #b9c2c7;margin-top:14px;padding-top:10px}
.wire h3{font-size:15px;margin:0 0 6px;color:#555;display:flex;justify-content:space-between;align-items:center;gap:8px}
.wire h3 button{font-size:13px;padding:4px 10px;border:1px solid #0b5d3b;color:#0b5d3b;background:#fff;border-radius:14px;cursor:pointer}
.wire img{display:block;width:100%;height:auto;border:1px solid #c9ced3;border-radius:6px;background:#fff;cursor:zoom-in}
.wire .cap{font-size:13px;color:#666;margin-top:6px}
.wire table{font-size:13px;margin-top:8px}
.wire td,.wire th{padding:4px 6px}
.wire table td:first-child{white-space:nowrap;font-weight:bold;color:#0b5d3b}
#zoom{position:fixed;inset:0;background:rgba(0,0,0,.88);display:none;z-index:50;align-items:center;justify-content:center;cursor:zoom-out}
#zoom.on{display:flex}
#zoom img{max-width:96vw;max-height:94vh;background:#fff}
@media (max-width:900px){
  main{grid-template-columns:1fr}
  .now{min-height:0}
  #now-text{font-size:17px}
  header h1{font-size:19px}
  .tools button,.tools a{font-size:14px;padding:6px 12px}
  nav{padding:8px 10px}
  nav button{font-size:13px;padding:5px 8px}
  main{padding:8px;gap:10px}
  .panel{padding:10px}
  .panel h3{font-size:14px;margin-top:12px}
  .panel li button{font-size:15px;padding:8px}
  /* 接线表在手机上改成卡片，一条一块 */
  .wire table,.wire tbody,.wire tr,.wire td{display:block;width:100%}
  .wire table{border:0}
  .wire tr:first-child{display:none}
  .wire tr{border:1px solid #c9ced3;border-radius:8px;margin:0 0 8px;padding:8px 10px;background:#fbfdfc}
  .wire td{border:0;padding:2px 0;font-size:14px}
  .wire td:first-child{font-size:15px;color:#0b5d3b;font-weight:bold;white-space:normal}
  .wire td:nth-child(2){color:#111}
  .wire td:nth-child(3){color:#666;font-size:13px}
  .wire td:nth-child(2)::before{content:"→ ";color:#0b5d3b;font-weight:bold}
}
</style>

var COMMON = {
  QS: "QS 是电源开关，接在三根电源线 L1、L2、L3 上。合上它，后面的主电路和控制电路才有电；断开它，就把电源和电路隔离开。",
  FU: "这是熔断器 FU，每相一个，串在主电路里做短路保护。电路短路时电流很大，熔丝先熔断，把电切断，保护线路和设备。",
  FRheat: "这是热继电器 FR 的热元件，分别串在主电路的三相里，流过的就是电机电流。电机过载时电流变大，热元件发热，双金属片弯曲，去推动控制电路里它的常闭触点断开。所以热元件一定串在主电路里，常闭触点一定串在控制电路里。",
  M: "这是三相异步电动机 M，三个接线端 U、V、W 接三根相线。三相通电就有旋转磁场，电机就转；任意对调其中两根线，电机就反转。"
};

   {n:2,name:"FR 常闭触点",x:735,y:470,bx:772,by:522,say:"这是热继电器 FR 的常闭触点，串联在控制回路里。电机长时间过载，主电路里的热元件发热，把它顶开，整个控制回路就断了，电机停下来。放在最前面，是为了一过载就把电截住，后面怎么按按钮都启动不了。"},
   {n:3,name:"SB1 停止按钮",x:735,y:575,bx:788,by:578,say:"SB1 是停止按钮，用常闭触点，串联在回路里。平时它是通的，一按就断开，KM 线圈失电，电机停。停止按钮用常闭更安全，接线松脱了也会停。"},
   {n:4,name:"SB2 启动按钮",x:735,y:705,bx:588,by:692,say:"SB2 是启动按钮，用常开触点。不按的时候这里是断开的，线圈没电，电机不转；按下去接通，电流才能走到线圈。"},

   {n:4,name:"SB2 的常闭触点（按钮互锁）",x:546,y:626,bx:585,by:622,say:"这个常闭触点是反转启动按钮 SB2 的一对触点，虚线表示和右边的 SB2 是同一个按钮。它串在正转支路的最上面：如果有人同时按两个按钮，SB2 的常闭先断开，正转支路就走不通。这叫按钮互锁。"},

   {n:7,name:"KM2 常闭触点（接触器互锁）",x:546,y:792,bx:660,by:792,say:"这是反转接触器 KM2 的常闭触点，串在 KM1 线圈回路里。KM2 吸着的时候它断开，KM1 就吸不上，两个接触器不会同时吸合造成短路。这叫接触器互锁。"},

   {n:8,name:"KM2 常闭触点（互锁）",x:581,y:825,bx:545,by:826,say:"反转接触器 KM2 的常闭触点，串在 KM1 线圈回路里，是互锁。KM2 吸着时 KM1 吸不上。"},

   {n:10,name:"SQ2 常开触点（在右支路）",x:810,y:648,bx:850,by:650,say:"这是 SQ2 的常开触点，放在右支路里，和左支路里那个常闭触点是同一个行程开关。工作台撞到 SQ2，它的常闭先断开左支路，常开再闭合右支路，KM2 得电，电机自动反转。同一个开关的两对触点分放在两个支路里，就是为了到头时停这边、起对面。"}
  ],
  extras: [
   {name:"右支路（KM2）",x:724,y:770,say:"右支路和左支路对称：启动按钮、KM2 自锁、SQ2 常开三者并联，后面串着 SQ1 常闭、SQ3 常闭、KM1 常闭，最后是 KM2 线圈。工作台撞到 SQ1，就停左支路、起右支路。"},
   {name:"SQ3 常闭触点（极限保护）",x:724,y:790,say:"SQ3 的常闭触点，右支路的极限保护。SQ1、SQ2 失灵时，工作台撞上 SQ3，把右支路断开。"},
   {name:"QS 电源开关",x:165,y:455,say:COMMON.QS},
   {name:"熔断器 FU",x:333,y:520,say:COMMON.FU},
   {name:"KM1 主触点",x:325,y:655,say:"KM1 的主触点，直接把三相接到电机，正转。"},
   {name:"KM2 主触点",x:450,y:655,say:"KM2 的主触点，两相交叉对调，所以吸合时电机反转。"},
   {name:"电动机 M1",x:333,y:875,say:COMMON.M}
  ],
  paths: [
   {name:"红线：按启动按钮（左支路）",color:"rgb(225,30,30)",say:"按启动按钮时，电流从 L3 相线下来，经过 SB1、启动按钮，再经过 SQ2 常闭、SQ4 常闭、KM2 常闭，流过 KM1 线圈，回到 L2 相线。",pts:[[[482,372],[581,372],[581,942],[535,942],[535,419]]]},
   {name:"橙线：松手以后（KM1 自锁）",color:"rgb(255,130,0)",say:"松手后，电流从 KM1 自锁触点这条橙线走，KM1 保持吸合。",pts:[[[581,596],[624,596],[624,697],[581,697]]]},
   {name:"紫线：撞到行程开关时（自动换向）",color:"rgb(150,20,200)",say:"工作台撞到 SQ2，SQ2 的常开触点闭合，电流走这条紫线进入右支路，再经过 SQ1 常闭、SQ3 常闭、KM1 常闭，流过 KM2 线圈，电机反转。",pts:[[[724,596],[810,596],[810,697],[724,697]]]}
  ]
},

"04": {
  tab: "04 自耦降压", img: "img/s04.png",
  intro: ["自耦变压器降压启动（时间继电器自动切换）", "先启动降压，时间一到自动切到全压。按编号 1 到 9 的顺序点一遍就是全过程。"],
  items: [
   {n:1,name:"FR 常闭触点",x:609,y:572,bx:640,by:572,say:"热继电器 FR 的常闭触点，串联。电机过载时断开，整个控制回路断电。"},
   {n:2,name:"SB1 停止按钮",x:609,y:633,bx:640,by:668,say:"SB1 是停止按钮，常闭。一按就断，KM1、KA、KM2 全部失电，电机停。"},
   {n:3,name:"SB2 启动按钮",x:610,y:738,bx:572,by:712,say:"SB2 是启动按钮，常开。按下去，KM1 线圈回路接通，启动开始。"},
   {n:4,name:"KM1 自锁触点",x:682,y:740,bx:712,by:745,say:"KM1 的辅助常开触点，和 SB2 并联。KM1 吸合后它闭合，松手后电流从这里走，KM1 保持吸合。"},
   {n:5,name:"KT 线圈",x:680,y:875,bx:712,by:800,say:"时间继电器 KT 的线圈，从 KM1 自锁触点下面引出。所以只有 KM1 吸合、已经启动了，KT 才开始计时。时间到了，它的延时触点动作，去接通 KA。"},
   {n:6,name:"KA 常闭触点",x:610,y:818,bx:574,by:818,say:"中间继电器 KA 的常闭触点，串联在 KM1 线圈回路里。KA 一吸合它就断开，KM1 失电，自耦变压器退出。它的作用是在启动结束时把启动接触器撤掉。"},
   {n:7,name:"KM1 线圈（启动）",x:610,y:875,bx:580,by:845,say:"KM1 是启动接触器。它吸合，主触点把电机接到自耦变压器的抽头上，电机降压启动。"},
   {n:8,name:"KT 延时闭合触点",x:748,y:743,bx:775,by:743,say:"KT 的延时闭合常开触点。KT 通电以后，要等设定的时间到了它才闭合，KA 线圈得电。它旁边并联的是 KA 自己的常开触点，KA 吸合后靠它保持。"},
   {n:9,name:"KA 常开 + KM1 常闭 → KM2",x:818,y:790,bx:848,by:850,say:"这一路串着 KA 的常开触点和 KM1 的常闭触点，后面是 KM2 线圈。KA 吸合，常开闭合；同时 KM1 已经释放，它的常闭复位，KM2 才能吸合。串 KM1 常闭是为了保证先断开启动接触器，再接通运行接触器，两个不会同时吸合。"}
  ],
  extras: [
   {name:"KA 线圈",x:675,y:875,say:"KA 是中间继电器，在启动结束时动作：常闭触点断开 KM1，常开触点接通 KM2，相当于一个切换开关。"},
   {name:"KM2 线圈（运行）",x:818,y:875,say:"KM2 是运行接触器。它吸合，主触点把电机直接接到三相电源上，全压运行。"},
   {name:"KM2 主触点",x:355,y:660,say:"KM2 的主触点，接在电源侧。闭合时电机直接接电源，全压运行。"},
   {name:"自耦变压器 T",x:440,y:700,say:"自耦变压器 T。它的抽头接到电机，抽头电压比电源电压低，所以电机降压启动。抽头有几个，可以选择启动电压。"},
   {name:"KM1 主触点",x:490,y:660,say:"KM1 的主触点，把自耦变压器的抽头和电机接通。"},
   {name:"KM1 星点触点",x:455,y:830,say:"KM1 的另一组触点，把自耦变压器的三个首端短接成星形，变压器才能工作。"},
   {name:"FR 热元件",x:362,y:716,say:COMMON.FRheat},
   {name:"电动机 M",x:352,y:890,say:COMMON.M},
   {name:"QS 电源开关",x:310,y:480,say:COMMON.QS},
   {name:"熔断器 FU",x:512,y:503,say:COMMON.FU},
   {name:"控制变压器 Tr",x:660,y:505,say:"Tr 是控制变压器，把电压降下来给指示灯电路用。"},
   {name:"指示灯 HL1、HL2、HL3",x:785,y:632,say:"三个指示灯：HL1 是电源指示，有电就亮；HL2 是降压启动指示，KM1 吸合时亮；HL3 是全压运行指示，KM2 吸合时亮。"}
  ],
  paths: [
   {name:"红线：按 SB2 启动",color:"rgb(225,30,30)",say:"按住 SB2 时，电流从 L3 相线经熔断器、FR、SB1、SB2，经过 KA 常闭，流过 KM1 线圈回到 L2。KM1 吸合，电机降压启动。",pts:[[[470,489],[609,489],[609,910],[547,910],[547,518]]]},
   {name:"橙线：松手以后（KM1 自锁）",color:"rgb(255,130,0)",say:"松手后，电流从 KM1 的辅助常开触点这条橙线走，KM1 保持吸合。",pts:[[[609,698],[682,698],[682,782],[609,782]]]},
   {name:"紫线：KT 线圈得电计时",color:"rgb(150,20,200)",say:"同时，电流从这个节点往下流过 KT 线圈，KT 开始计时。",pts:[[[682,782],[682,910]]]},
   {name:"蓝线：时间到，KA 吸合",color:"rgb(0,90,230)",say:"时间到了，KT 的延时触点闭合，电流走这条蓝线，KA 线圈得电。",pts:[[[609,698],[748,698],[748,910]]]},
   {name:"绿线：KM2 吸合，全压运行",color:"rgb(0,150,70)",say:"KA 吸合后，它的常开触点闭合，电流走这条绿线，经过 KM1 常闭，KM2 线圈得电，电机全压运行。",pts:[[[609,698],[818,698],[818,910]]]}
  ]
},

"05": {
  tab: "05 按钮星角", img: "img/s05.png",
  intro: ["接触器控制的 Y—△ 降压启动（按钮切换）", "先按启动按钮接成星形，再按切换按钮换成三角形。按编号顺序点一遍。"],
  items: [
   {n:1,name:"FR 常闭触点",x:642,y:428,bx:668,by:428,say:"热继电器 FR 的常闭触点，串联。电机过载时断开，KM、KMY、KM△ 全部失电。"},
   {n:2,name:"SB3 停止按钮",x:642,y:483,bx:610,by:465,say:"SB3 是停止按钮，常闭。一按就断，三个接触器全部释放。"},
   {n:3,name:"启动按钮 SB1",x:642,y:556,bx:600,by:612,say:"SB1 是启动按钮，常开。按下去，KM 和 KMY 两个线圈同时得电，电机接成星形启动。"},
   {n:4,name:"KM 自锁触点",x:707,y:556,bx:768,by:552,say:"KM 的辅助常开触点，和启动按钮并联。松手以后 KM 保持吸合，一直给电机供着三相电源。"},
   {n:5,name:"KM 线圈",x:642,y:840,bx:612,by:700,say:"KM 是电源接触器，线圈直接接在横线上。所以从启动到运行它一直吸合。"},
   {n:6,name:"KM△ 常闭触点（互锁）",x:707,y:628,bx:672,by:612,say:"KM△ 的常闭触点，串在 KMY 线圈回路里，是互锁。KM△ 吸着时 KMY 吸不上。因为 KMY 和 KM△ 同时吸合，电源会被短接。"},
   {n:7,name:"SB2 常闭触点",x:707,y:736,bx:672,by:740,say:"切换按钮 SB2 的常闭触点，串在 KMY 回路里。按下 SB2，它先断开，KMY 失电，电机先脱离星形。"},
   {n:8,name:"KMY 线圈（星形）",x:707,y:840,bx:737,by:800,say:"KMY 是星形接触器。它吸合，主触点把电机 U2、V2、W2 短接在一起，电机接成星形，降压启动。"},
   {n:9,name:"SB2 常开触点",x:767,y:736,bx:735,by:740,say:"SB2 的常开触点，在 KMY 回路断开以后才闭合，接通 KM△ 回路。"},
   {n:10,name:"KM△ 自锁触点",x:814,y:766,bx:848,by:735,say:"KM△ 的辅助常开触点，和 SB2 的常开触点并联。松手以后 KM△ 保持吸合。"},
   {n:11,name:"KMY 常闭触点（互锁）",x:767,y:628,bx:806,by:610,say:"KMY 的常闭触点，串在 KM△ 线圈回路里，是互锁。KMY 吸着时 KM△ 吸不上。"},
   {n:12,name:"KM△ 线圈（三角形）",x:767,y:840,bx:805,by:840,say:"KM△ 是三角形接触器。它吸合，主触点把 U2、V2、W2 分别和 W1、U1、V1 接通，电机接成三角形，全压运行。"}
  ],
  extras: [
   {name:"KM 主触点",x:400,y:545,say:"KM 的主触点，把三相电源接到电机 U1、V1、W1。"},
   {name:"KMY 主触点（星形）",x:350,y:900,say:"KMY 的主触点，三个，把电机 U2、V2、W2 三个端子短接，就是星形接法。这时每相电压降到 220 伏，启动电流是直接启动的三分之一。"},
   {name:"KM△ 主触点（三角形）",x:470,y:740,say:"KM△ 的主触点，把 U2、V2、W2 分别接到 W1、U1、V1，就是三角形接法。这时每相电压是 380 伏，全压运行。"},
   {name:"FR 热元件",x:342,y:599,say:COMMON.FRheat},
   {name:"电动机 M（六个出线端）",x:330,y:750,say:"电动机有六个出线端。U1、V1、W1 接电源，U2、V2、W2 用来接成星形或三角形。星三角启动只用于正常运行时是三角形接法的电机。"},
   {name:"QS 电源开关",x:185,y:445,say:COMMON.QS},
   {name:"熔断器 FU",x:300,y:400,say:COMMON.FU}
  ],
  paths: [
   {name:"红线：按启动按钮，KM 吸合",color:"rgb(225,30,30)",say:"按启动按钮时，电流经 FR、SB3、启动按钮流过 KM 线圈。KM 吸合。",pts:[[[642,395],[642,879],[566,879],[566,439]]]},
   {name:"橙线：松手以后（KM 自锁）",color:"rgb(255,130,0)",say:"松手后，电流从 KM 自锁触点这条橙线走。",pts:[[[642,533],[707,533],[707,579],[642,579]]]},
   {name:"紫线：KMY 吸合，星形启动",color:"rgb(150,20,200)",say:"同时，电流从横线走这条紫线，经过 KM△ 常闭、SB2 常闭，流过 KMY 线圈，电机接成星形启动。",pts:[[[642,579],[707,579],[707,879]]]},
   {name:"绿线：切换后 KM△ 吸合，三角形运行",color:"rgb(0,150,70)",say:"按切换按钮后，KMY 回路先断，电流改走这条绿线，经过 KMY 常闭、SB2 常开，流过 KM△ 线圈，电机接成三角形全压运行。",pts:[[[642,579],[767,579],[767,879]],[[767,719],[814,719],[814,814],[767,814]]]}
  ]
},

"07": {
  tab: "07 机械制动", img: "img/s07.png",

var W = 900, H = 950;
var cur = "01";
var voiceOn = true;
var voices = [];
var playing = false;
var stage = document.getElementById("stage");
var pic = document.getElementById("pic");
var ring = document.getElementById("ring");
var nowName = document.getElementById("now-name");
var nowText = document.getElementById("now-text");
var listEl = document.getElementById("list");
var pathsEl = document.getElementById("paths");
var voiceBtn = document.getElementById("voice");
var playBtn = document.getElementById("playall");

function loadVoices() { try { voices = window.speechSynthesis.getVoices() || []; } catch (e) { voices = []; } }
if (window.speechSynthesis) { loadVoices(); window.speechSynthesis.onvoiceschanged = loadVoices; }
else { voiceBtn.disabled = true; voiceBtn.textContent = "此浏览器不支持朗读"; playBtn.disabled = true; }

function pickVoice() {
  var zh = [];
  for (var i = 0; i < voices.length; i += 1) { if (/^zh/i.test(voices[i].lang)) { zh.push(voices[i]); } }
  var pref = ["Xiaoxiao", "Yunxi", "Yunyang", "Huihui", "Yaoyao", "Kangkang", "Tingting", "Meijia", "Hanhan"];
  for (var p = 0; p < pref.length; p += 1) {
    for (var k = 0; k < zh.length; k += 1) { if (zh[k].name.indexOf(pref[p]) >= 0) { return zh[k]; } }
  }
  return zh[0] || null;
}

function speak(name, text, onend) {
  var fallbackMs = 1200 + (name.length + text.length) * 260;
  if (!voiceOn || !window.speechSynthesis || typeof SpeechSynthesisUtterance === "undefined" || voices.length === 0) {
    if (onend) { setTimeout(onend, fallbackMs); }
    return;
  }
  try { window.speechSynthesis.cancel(); } catch (e) {}
  var done = false;
  var finish = function () { if (!done && onend) { done = true; onend(); } };
  var u = new SpeechSynthesisUtterance(name + "。" + text);
  u.lang = "zh-CN";
  var v = pickVoice();
  if (v) { u.voice = v; }
  u.onend = finish;
  u.onerror = finish;
  setTimeout(finish, fallbackMs * 2 + 4000);
  try { window.speechSynthesis.speak(u); } catch (e) { finish(); }
}

function stopPlaying() { playing = false; playBtn.textContent = "▶ 从头讲一遍"; if (window.speechSynthesis) { window.speechSynthesis.cancel(); } }

function show(entry, ringAt) {
  nowName.textContent = entry.name;
  nowText.textContent = entry.say;
  var at = ringAt || entry;
  ring.style.left = (at.x / W * 100) + "%";
  ring.style.top = (at.y / H * 100) + "%";
  ring.classList.remove("on");
  void ring.offsetWidth;
  ring.classList.add("on");
  var rows = listEl.querySelectorAll("button");
  for (var i = 0; i < rows.length; i += 1) { rows[i].classList.toggle("on", entry.n !== undefined && rows[i].getAttribute("data-n") === String(entry.n)); }
  var prow = pathsEl.querySelectorAll("button");
  for (var j = 0; j < prow.length; j += 1) { prow[j].classList.toggle("on", entry.path !== undefined && prow[j].getAttribute("data-p") === String(entry.path)); }
  if (window.innerWidth <= 900) { document.querySelector(".now").scrollIntoView({ behavior: "smooth", block: "nearest" }); }
}

function select(entry, speakIt) {
  stopPlaying();
  show(entry);
  if (speakIt !== false) { speak(entry.name, entry.say); }
}

function intro() {
  stopPlaying();
  ring.classList.remove("on");
  nowName.textContent = DATA[cur].intro[0];
  nowText.textContent = DATA[cur].intro[1];
  var rows = listEl.querySelectorAll("button");
  for (var i = 0; i < rows.length; i += 1) { rows[i].classList.remove("on"); }
  var prow = pathsEl.querySelectorAll("button");
  for (var j = 0; j < prow.length; j += 1) { prow[j].classList.remove("on"); }
}

function dist(px, py, x, y) { return Math.sqrt((px - x) * (px - x) + (py - y) * (py - y)); }

function distToPath(px, py, lines) {
  var best = 1e9;
  for (var l = 0; l < lines.length; l += 1) {
    for (var i = 0; i < lines[l].length - 1; i += 1) {
      var ax = lines[l][i][0], ay = lines[l][i][1], bx = lines[l][i + 1][0], by = lines[l][i + 1][1];
      var dx = bx - ax, dy = by - ay, len2 = dx * dx + dy * dy;
      var t = len2 ? ((px - ax) * dx + (py - ay) * dy) / len2 : 0;
      if (t < 0) { t = 0; } else if (t > 1) { t = 1; }
      var d = dist(px, py, ax + t * dx, ay + t * dy);
      if (d < best) { best = d; }
    }
  }
  return best;
}

function hit(px, py) {
  var d = DATA[cur], i;
  for (i = 0; i < d.items.length; i += 1) { if (dist(px, py, d.items[i].bx, d.items[i].by) <= 22) { return d.items[i]; } }
  for (i = 0; i < d.items.length; i += 1) { if (dist(px, py, d.items[i].x, d.items[i].y) <= 26) { return d.items[i]; } }
  for (i = 0; i < d.extras.length; i += 1) { if (dist(px, py, d.extras[i].x, d.extras[i].y) <= 36) { return d.extras[i]; } }
  for (i = 0; i < d.paths.length; i += 1) {
    if (distToPath(px, py, d.paths[i].pts) <= 11) { return { path: i, name: d.paths[i].name, say: d.paths[i].say, color: d.paths[i].color }; }
  }
  var best = null, bestD = 75;
  for (i = 0; i < d.items.length; i += 1) {
    var dd = Math.min(dist(px, py, d.items[i].x, d.items[i].y), dist(px, py, d.items[i].bx, d.items[i].by));
    if (dd < bestD) { bestD = dd; best = d.items[i]; }
  }
  for (i = 0; i < d.extras.length; i += 1) {
    var de = dist(px, py, d.extras[i].x, d.extras[i].y);
    if (de < bestD) { bestD = de; best = d.extras[i]; }
  }
  return best;
}

function build() {
  var d = DATA[cur];
  pic.src = d.img;
  pic.alt = d.intro[0];
  listEl.innerHTML = "";
  pathsEl.innerHTML = "";
  var i;
  for (i = 0; i < d.items.length; i += 1) {
    var li = document.createElement("li");
    var b = document.createElement("button");
    b.type = "button";
    b.setAttribute("data-n", String(d.items[i].n));
    b.innerHTML = "<b>" + d.items[i].n + "</b>" + d.items[i].name;
    b.onclick = (function (entry) { return function () { select(entry); }; })(d.items[i]);
    li.appendChild(b);
    listEl.appendChild(li);
  }
  for (i = 0; i < d.paths.length; i += 1) {
    var li2 = document.createElement("li");
    var b2 = document.createElement("button");
    b2.type = "button";
    b2.setAttribute("data-p", String(i));
    b2.innerHTML = '<span class="sw" style="background:' + d.paths[i].color + '"></span>' + d.paths[i].name;
    b2.onclick = (function (idx) { return function () {
      var p = DATA[cur].paths[idx];
      select({ path: idx, name: p.name, say: p.say, color: p.color });
      ring.classList.remove("on");
    }; })(i);
    li2.appendChild(b2);
    pathsEl.appendChild(li2);
  }
  renderWire(d);
  intro();
}

function renderWire(d) {
  var w = WIRE[cur];
  var box = document.getElementById("wirebox");
  if (!w) { box.style.display = "none"; return; }
  box.style.display = "";
  var img = document.getElementById("wireimg");
  if (w.img) {
    img.src = w.img;
    img.style.display = "";
  } else {
    img.removeAttribute("src");
    img.style.display = "none";
  }
  document.getElementById("wirecap").textContent = w.cap || "";
  var t = document.getElementById("wiretab");
  var rows = ['<tr><th>从这里</th><th>接到这里</th><th>为什么</th></tr>'];
  for (var i = 0; i < w.rows.length; i += 1) {
    rows.push("<tr><td>" + w.rows[i][0] + "</td><td>" + w.rows[i][1] + "</td><td>" + (w.rows[i][2] || "") + "</td></tr>");
  }
  t.innerHTML = rows.join("");
}

function buildTabs() {
  var nav = document.getElementById("tabs");
  var keys = Object.keys(DATA);
  for (var i = 0; i < keys.length; i += 1) {
    var b = document.createElement("button");
    b.type = "button";
    b.textContent = DATA[keys[i]].tab;
    b.onclick = (function (k) { return function () {
      stopPlaying();
      cur = k;
      var all = nav.querySelectorAll("button");
      for (var j = 0; j < all.length; j += 1) { all[j].classList.toggle("on", j === Object.keys(DATA).indexOf(k)); }
      build();
    }; })(keys[i]);
    if (keys[i] === cur) { b.classList.add("on"); }
    nav.appendChild(b);
  }
}

stage.addEventListener("click", function (e) {
  var r = pic.getBoundingClientRect();
  var px = (e.clientX - r.left) * W / r.width;
  var py = (e.clientY - r.top) * H / r.height;
  var entry = hit(px, py);
  if (entry) { select(entry); }
  else {
    stopPlaying();
    ring.classList.remove("on");
    nowName.textContent = "这里没有元件";
    nowText.textContent = "点黄色的编号圆圈，或者图里的触点、按钮、线圈、彩线。";
  }
});

voiceBtn.onclick = function () {
  voiceOn = !voiceOn;
  voiceBtn.textContent = voiceOn ? "🔊 朗读：开" : "🔇 朗读：关";
  voiceBtn.classList.toggle("off", !voiceOn);
  if (!voiceOn && window.speechSynthesis) { window.speechSynthesis.cancel(); }
};

playBtn.onclick = function () {
  if (playing) { stopPlaying(); return; }
  playing = true;
  playBtn.textContent = "■ 停止";
  var items = DATA[cur].items;
  var idx = 0;
  var step = function () {
    if (!playing || idx >= items.length) { stopPlaying(); return; }
    show(items[idx]);
    speak(items[idx].name, items[idx].say, function () { idx += 1; step(); });
  };
  step();
};

buildTabs();
build();

document.getElementById("wiresay").onclick = function () {
  var w = WIRE[cur];
  if (!w) { return; }
  stopPlaying();
  show({ name: DATA[cur].intro[0] + " 的实物接线", say: w.say });
  speak("实物接线", w.say);
};

var zoomBox = document.getElementById("zoom");
document.getElementById("wireimg").onclick = function () {
  var src = this.getAttribute("src");
  if (!src) { return; }
  document.getElementById("zoomimg").src = src;
  zoomBox.classList.add("on");
};
zoomBox.onclick = function () { zoomBox.classList.remove("on"); };
</script>
</body>
</html>
