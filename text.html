# 电动机控制 9 个电路 · 逐根线讲原理（考前速成）

> 范围：软件"电动机控制"里打勾的 9 个：01 过载保护正转、02 双重互锁正反转、03 行程控制（自动往返）、04 自耦降压启动、05 接触器 Y—△ 启动、06 时间继电器 Y—△ 启动、07 机械制动、08 反接制动、09 能耗制动。
> 每张图都是从软件"电路"页原图截出来的，彩线 = 电流走的路，编号 = 这根线为什么在这儿。

---

## 0. 先学会"找线"：4 条通用规律（看懂这个，9 个图全通）

读控制电路的口诀：**先找线圈（方框），从线圈往上倒着数，碰到什么记什么，一直数到另一根电源线。** 9 个电路的控制回路全都是下面这个骨架，只是往里加了东西：

```
电源一相 ─ 熔断器 ─ FR常闭(过载保护) ─ 停止按钮(常闭) ─┬─ 启动按钮(常开) ─┐
                                                      └─ 自锁触点(常开) ─┴─ [互锁触点(常闭)] ─ 线圈 ─ 另一相
```

| 规律 | 一句话 | 为什么 |
|---|---|---|
| ① 串联 = 谁都能"否决" | 串联在回路里的东西，断开一个，线圈就没电 | 所以停止按钮、FR常闭、互锁触点都**串联** |
| ② 并联 = 多一条路都能"接通" | 并联的东西，只要有一条路通，线圈就有电 | 所以自锁触点、行程开关常开都**并联**在启动按钮两端 |
| ③ 自锁触点 = 接触器自己的常开触点，并联在启动按钮两端 | 手一松，电流改走自锁触点 | 松手后接触器仍然吸合，叫**自锁** |
| ④ 互锁触点 = 对方接触器的常闭触点，串联在本方线圈回路里 | 对方吸合，本方就不可能吸合 | 防止两个接触器同时吸合造成短路，叫**互锁** |

符号速查：常开触点（断开的斜线，通电才合，也叫"动合"）；常闭触点（带斜杠，通电就断，也叫"动断"）；按钮旁边的小"⌐"和虚线表示"这是手按的"，**虚线把同一个按钮/开关的两对触点连起来**；线圈 = 方框；FR = 热继电器（主电路里是热元件，控制电路里是它的常闭触点）；KT = 时间继电器（触点旁带圆弧 = 延时）。

**"动断先断、动合后合"**：按钮、行程开关、热继电器动作时，都是常闭触点**先**断开，常开触点**后**闭合。旁白里反复说的"其动断触点先断开…然后动合触点闭合"就是这个意思。

**注意一个坑：动画旁白和"电路"页的按钮编号对不上**（这多半是你越听越乱的原因）。记住功能就行：

| 电路 | "电路"页图上的编号（本文标注图用它） | 动画旁白里的说法 |
|---|---|---|
| 01 / 07 | SB1 停止，SB2 启动 | 相同 |
| 02 | SB3 停止，SB1 正转启动，SB2 反转启动 | SB1 停止，SB2 正转启动，SB3 反转启动 |
| 03 | SB1 停止，SB3 接通 KM1 支路，SB2 接通 KM2 支路 | SB1 停止，SB2 启动 |
| 04 / 08 / 09 | SB1 停止，SB2 启动 | 相同 |
| 05 | SB3 停止，SB1 启动（星），SB2 切换（角） | SB1 停止，SB2 启动（星），SB3 切换（角） |
| 06 | SB 停止，SB1 启动 | SB1 停止，SB2 启动 |

## 01 具有过载保护的单向运转控制（一切的基础）

![01](a01.png)

**它干什么：** 按一下启动，电机一直转；按一下停止，电机停；电机长时间过载，自动停。

**主电路（绿线）每根线为什么这么接：** L1 L2 L3 → QS（电源开关）→ FU 熔断器（每相一个，短路保护）→ **7** KM 主触点（三个同时动作，管电机有没有电）→ **8** FR 热元件（三片，串在主电路里"感受"电机电流）→ 电机 U V W。它们全是**串联**：每一个都是"断开就停"的东西（规律①）。

**控制电路（红线）从上往下数：**

1. **①** 电从 L3 相线经熔断器引来，回路另一头接在 L2 相线上。为什么跨两相：线圈两端接的是 380V 线电压（线圈额定电压 380V）。
2. **②** FR 常闭触点，串联。过载时热元件发热 → 这个触点断开 → 整个控制回路断 → 线圈失电 → 电机停。放在最前面：一过载，后面怎么按按钮都没用。
3. **③** SB1 停止按钮，**常闭**，串联。不按它是通的，一按就断。
4. **④** SB2 启动按钮，**常开**。不按，这里断开，线圈没电。
5. **⑤** KM 辅助常开触点，**和 SB2 并联**。KM 一吸合它就闭合，电流可以从这里绕过 SB2（橙线）→ 松手后线圈仍有电 → 这就是**自锁**。为什么必须并在 SB2 两端、而不是别处：只有这样，松手后电流"绕过"的是启动按钮，而停止按钮 SB1 和 FR 仍然串在回路里，照样能停。
6. **⑥** KM 线圈，接在最后，回到 L2。

**电流怎么走：**
- 启动：合 QS → 按住 SB2：L3 → 熔断器 → FR常闭 → SB1 → SB2（已按）→ KM线圈 → L2。KM 吸合：主触点闭合（电机转），辅助常开闭合。
- 松手：L3 → 熔断器 → FR → SB1 → **KM辅助常开（自锁）** → KM线圈 → L2，仍然通。
- 停止：按 SB1 → 回路断 → KM 释放 → 主触点、自锁触点一起断 → 电机停。松开 SB1 也不会自己再转（SB2 和自锁触点都是断开的）。
- 过载：电机电流太大 → FR 热元件发热 → 常闭触点断 → 同"停止"。

**必背：** 自锁 = 接触器通电后，利用自身辅助常开触点保持线圈继续通电。热继电器的**热元件串在主电路**，**常闭触点串在控制电路**。停止按钮用常闭、启动按钮用常开。

---

## 02 双重互锁的可逆（正反转）控制

![02](a02.png)

**它干什么：** 让电机能正转也能反转。原理：**任意对调两根电源线，电机就反转**。所以主电路用两个接触器：KM1 直接接过去（正转），KM2 把两相对调（**⑨** 图上交叉的那几根线，反转）。两个接触器**绝对不能同时吸合**，否则相间短路——所以要互锁。"双重" = 按钮互锁 + 接触器互锁。

**控制电路从上往下：**

1. **①** 控制回路熔断器。**②** FR 常闭。**③** SB3 停止（常闭）。之后分成左右对称的两支。
2. 左支（KM1，正转）最上面 **④** 那个常闭触点：它是**反转启动按钮 SB2 的常闭触点**（虚线把它和 SB2 的按钮符号连着 = 同一个按钮）。为什么放在正转回路里：你同时按两个按钮时，SB2 的常闭**先断开**正转回路，KM1 吸不上。这叫**按钮互锁**。
3. **⑤** SB1 正转启动（常开），**⑥** KM1 辅助常开与它**并联** = 自锁（规律③）。
4. **⑦** KM2 常闭触点，串联在 KM1 线圈回路里：KM2 吸着时它断开，KM1 不可能吸合。这叫**接触器互锁**（规律④）。哪怕某个接触器主触点焊死断不开，另一个也吸不上，不会短路。
5. **⑧** KM1 线圈。
6. 右支（KM2，反转）完全镜像：SB1 的常闭（按钮互锁）→ SB2 ∥ KM2自锁 → KM1 常闭（接触器互锁）→ KM2 线圈。

**电流怎么走（正转）：** 按 SB1 → L3 → 熔断器 → FR → SB3 → SB2常闭 → SB1（已按）→ KM2常闭 → KM1线圈 → 回 L2。KM1 吸合：主触点闭（正转）、自锁、KM1 常闭触点断开反转支路。
反转：按 SB3 停，再按 SB2；或直接按 SB2（它的常闭先断 KM1 回路，KM1 释放后其常闭复位，SB2 的常开才接通 KM2）。

**必背：** 双重互锁 = 接触器互锁 + 按钮互锁。自锁触点**并联**在本方启动按钮两端；互锁触点**串联**在对方线圈回路里。

## 03 工作台自动往返（行程控制）

![03](a03.png)

**它干什么：** 工作台走到一端自动停、自动往回走。方法：在两个限定位置装行程开关 SQ，工作台上的撞块碰它。每个行程开关有**一对常开 + 一对常闭**（图上虚线连着的两处是同一个开关）。

**主电路：** 和 02 一样（KM1、KM2 交叉对调）。

**控制电路：** SB1 停止（常闭）→ **②** 一根横线把电分给 6 个常开触点 → 左右两支：

- 左支（KM1）：**③** 启动按钮 ∥ **④** KM1 自锁 ∥ **⑤** SQ1 常开 → **⑥** SQ2 常闭 → **⑦** SQ4 常闭 → **⑧** KM2 常闭（互锁）→ **⑨** KM1 线圈
- 右支（KM2）：启动按钮 ∥ KM2 自锁 ∥ **⑩** SQ2 常开 → SQ1 常闭 → SQ3 常闭 → KM1 常闭（互锁）→ KM2 线圈

**为什么这么接：**
- 同一个行程开关的两对触点**分放在两个支路**：常开放在"对方要启动的支路"里并联，常闭放在"自己要停止的支路"里串联。工作台往一个方向走，到头撞到那头的开关，就要"停这边、起对面"。
- 例：KM1 吸合电机正转，工作台移动，撞到 SQ2 → **⑥** SQ2 常闭**先断**（KM1 停）→ **⑩** SQ2 常开**后合**（接通 KM2，紫线）→ 反转 → 回来撞 SQ1 → 又换向。
- **⑦** SQ4（和右支的 SQ3）：**极限保护（终端保护）**。万一 SQ1、SQ2 坏了不动作，工作台冲过去撞上 SQ4，把回路硬断开，防止越位出事故。

**必背：** SQ3、SQ4 的作用 = 防止 SQ1、SQ2 失灵造成工作台越位的极限保护。动作顺序 = 动断先断、动合后合。

---

## 04 自耦变压器降压启动（时间继电器自动切换）

![04](a04.png)

**它干什么：** 较大容量的电机直接启动电流太大。启动时让电机经**自耦变压器**降压；启动完自动切到全压。电路分三部分：主电路、控制电路、指示电路。多了三种电器：KT 时间继电器（到时间才动作）、KA 中间继电器（"传令兵"，触点多）、HL 指示灯。

**主电路：** L1 L2 L3 → KM2 主触点 → FR → 电机。自耦变压器 T 有两组接头：**三个首端**经 **KM1 的主触点**接三相电源，**抽头**直接接电机侧（和 FR 下端是同一个点）；三个尾端由 KM1 的另一组触点短接成星形。KM1 吸合 = 变压器通电，电机从抽头拿到较低电压；KM2 吸合 = 电机直接接电源全压。两者不能同时吸合。

**控制电路（从横线往下有 4 条并联支路）：**

1. **①** FR 常闭，**②** SB1 停止（常闭）。
2. 第 1 条：**③** SB2 启动 ∥ **④** KM1 自锁 → **⑥** KA 常闭 → **⑦** KM1 线圈。为什么串 KA 常闭：KA 是"切换指挥"，它一吸合就把 KM1 回路断开，让变压器退出。
3. 第 2 条：从 KM1 自锁触点下面（和 KM1 线圈同一个节点）引出 → **⑤** KT 线圈。为什么接在这个节点：只有 KM1 已经吸合（已经启动），KT 才开始计时。
4. 第 3 条：**⑧** KT 延时闭合常开 ∥ KA 自锁常开 → KA 线圈。时间一到，KT 的延时触点闭合 → KA 吸合，并用自己的触点保持住。
5. 第 4 条：KA 常开 → KM1 常闭 → KM2 线圈（**⑨**）。为什么串 KM1 常闭：保证 KM1 先释放、变压器先退出，KM2 才能吸合。

**指示电路：** 控制变压器 Tr 把电压变成指示灯用的电压。HL1 直接接（有电就亮 = 电源指示）；HL2 经 KM1 常开触点（启动时亮 = 降压运行指示）；HL3 经 KM2 常开触点（全压运行指示）。

**全过程：** 合 QS → HL1 亮 → 按 SB2 → KM1 吸合自锁，KT 开始计时，HL2 亮，电机降压启动 → 时间到 → KT 延时闭合 → KA 吸合自锁 → KA 常闭断开 KM1（HL2 灭）→ KA 常开接通 KM2 → 全压运行，HL3 亮。停止按 SB1。

## 05 接触器控制的 Y—△ 降压启动（按钮切换）

![05](a05.png)

**它干什么：** 解决启动电流过大。启动时把定子绕组接成**星形（Y）**，每相电压降为 1/√3，启动电流和启动转矩都降为直接启动的 **1/3**；启动完再接成**三角形（△）**全压运行。**只适用于正常运行时为三角形接法的电机**（有 6 个出线端 U1 V1 W1 U2 V2 W2）。

**主电路三个接触器：** KM 主触点接通电源（U1 V1 W1）；**KMY** 主触点把 U2 V2 W2 短接 = 星形；**KM△** 主触点把 U2 V2 W2 分别接到 W1 U1 V1 = 三角形。KMY 和 KM△ **不能同时吸合**（同时吸合 = 电源短路）。

**控制电路：** FR 常闭（**①**）→ SB3 停止（**②**）→ SB1 启动（**③**）∥ KM 自锁（**④**）→ 节点 → 横线分三路：

- **⑤** KM 线圈直接接在横线上。为什么：从启动到运行，电源接触器 KM 一直要吸合。
- **⑥** KM△ 常闭 → **⑦** SB2 常闭 → **⑧** KMY 线圈。为什么串 KM△ 常闭：互锁。为什么串 SB2 的常闭：SB2 是**复合按钮**（一动合一动断），按下去**常闭先断** → KMY 先释放。
- **⑪** KMY 常闭 → SB2 常开（**⑨**）∥ KM△ 自锁（**⑩**）→ **⑫** KM△ 线圈。常闭断完，SB2 的常开**后合** → KM△ 吸合（这时 KMY 常闭已复位）并自锁。

**全过程：** 按 SB1 → KM 吸合自锁；KMY 吸合（经 KM△ 常闭、SB2 常闭）→ 星形降压启动。启动结束按 SB2 → 常闭先断 KMY → 常开后合 KM△ 并自锁 → 三角形全压运行（KM△ 常闭同时断开 KMY 回路 = 互锁）。停止按 SB3。

---

## 06 时间继电器控制的 Y—△ 降压启动（自动切换）

![06](a06.png)

**和 05 的区别只有一点：** 没有 SB2，由时间继电器 KT 自动完成"先断 KMY、后通 KM△"。主电路完全相同。

**控制电路：** FR 常闭（**①**）→ SB 停止（**②**）→ SB1 启动（**③**）∥ KM 自锁（**④**）→ 节点 → 横线分三路：

- **⑤** KM 线圈直接接。
- **⑥** KM△ 常闭（互锁）→ 节点 → **⑦** KT **延时断开**的常闭 → **⑧** KMY 线圈；**⑨** KT 线圈从这个节点直接引出。为什么 KT 线圈接在这：KM 一吸合，KT 就开始计时。
- **⑩** KMY 常闭（互锁）→ **⑪** KT **延时闭合**的常开 → **⑫** KM△ 线圈。

**为什么"先断后合"不会出错：** 断 KMY 和接通 KM△ 用的是**同一个时间继电器**的两对触点：延时断开的常闭串在 KMY 里，延时闭合的常开串在 KM△ 里。时间一到，它自己保证"先断开星形，再接通三角形"。

**全过程：** 按 SB1 → KM 吸合自锁；KT 得电计时；KMY 经 KM△ 常闭、KT 常闭吸合 → 星形启动 → 时间到 → KT 常闭**先断** KMY → KT 常开**后合** KM△ → 三角形全压运行（KM△ 常闭同时断开 KT 线圈，计时结束）。停止按 SB。

**必背：** Y—△ 启动只适用于三角形接法的电机；启动电流、启动转矩均为直接启动的 1/3。

---

## 07 机械制动（电磁抱闸，断电抱闸）

![07](a07.png)

**它干什么：** 切断电源后立即停转。装置 = 电磁抱闸：**电磁线圈、衔铁、杠杆、弹簧、闸瓦、闸轮**。线圈**通电** → 衔铁吸上 → 杠杆抬起 → 闸瓦**松开**闸轮；线圈**断电** → 弹簧把闸瓦**抱紧**闸轮。这叫断电制动型：停电时也会刹住，安全。

**主电路里最关键的一根线：** 抱闸线圈（**⑦**，蓝线）**并接在电机的两根相线（V、W）上，而且接在 KM 主触点的后面（靠电机这一侧）**。为什么这么接：KM 一吸合，电机通电的同时抱闸线圈也通电 → 松闸 → 电机才能转；KM 一断（按停止按钮或突然停电），抱闸线圈立刻失电 → 闸瓦抱紧 → 电机立即停。并接在 KM 后面而不是前面，才能保证"电机有电 = 松闸，电机没电 = 抱闸"永远同步。主电路其余部分和 01 完全一样。

**控制电路：** 和 01 相同：熔断器（**①**）→ SB1 停止（**②**，常闭）→ SB2 启动（**③**，常开）∥ KM 自锁（**④**）→ KM 线圈（**⑤**）→ FR 常闭（**⑥**）→ 回另一相。FR 常闭画在回路的另一头，但仍然**串联**在回路里，作用不变。

**全过程：** 合 QS → 按 SB2 → KM 吸合自锁 → 主触点闭合：电机通电，同时抱闸线圈通电松闸，电机转动。按 SB1（或突然停电）→ KM 释放 → 抱闸线圈断电 → 闸瓦立即抱紧闸轮 → 电机迅速停转。

---

## 08 反接制动（速度继电器控制）

![08](a08.png)

**它干什么：** 电机断电后靠惯性还会转。让它尽快停：停车时**立即对调两根电源线**，让电机产生反向的力矩"拽住"它；等转速降到接近零（旁白：小于 120 转/分）必须马上切断，否则电机就反着转起来了。

**器件：** KM1（正转）、KM2（反接制动）、SB1（**复合按钮**：停止 + 制动）、SB2（启动）、**SR 速度继电器**（和电机轴连在一起：转速大于 120 转/分时它的常开触点闭合，小于 120 时断开）。

**主电路：** KM1 的主触点直接接过去；KM2 的主触点**每相串一个电阻 R**（**⑩**，对调两相）。为什么串电阻：反接时定子里旋转磁场和转子转向相反，电流非常大，电阻用来**限流**。

**控制电路（FR 常闭 **①** 之后分三路）：**

- 左路：**②** SB1 常闭 → **③** SB2 启动 ∥ KM1 自锁 → **⑥** KM2 常闭（互锁）→ **⑦** KM1 线圈
- 右路：**④** SB1 常开（和左边那个常闭是同一个按钮，虚线连着）→ 汇到中路
- 中路：**⑤** SR 常开 → **⑧** KM1 常闭（互锁）→ **⑨** KM2 线圈

**为什么这么接：**
- SB1 用复合按钮：按下时常闭**先断** KM1（电机脱离正转电源），常开**后合**才接通制动支路 → KM1、KM2 绝不会同时吸合。
- 制动支路串 SR 常开：电机转着（大于 120 转/分）它才闭合；转速一降到 120 以下它**自动断开** → KM2 自动释放 → 制动**自动结束**，电机不会反转。
- 刚启动时电机还没转，SR 是断开的，所以即使 SB1 的常开碰巧接通，KM2 也吸不上。
- **⑥⑧** 两对互锁：KM1 没释放，KM2 吸不上；KM2 吸着，KM1 吸不上。

**全过程：** 按 SB2 → KM1 吸合自锁 → 电机正转 → 转速升高 → SR 常开闭合（为制动做准备）。停车：按 SB1 → 常闭断 KM1（电机断电，惯性转）→ 常开合 → 经 SR、KM1 常闭 → KM2 吸合 → 反接制动 → 转速降到 120 转/分以下 → SR 断开 → KM2 释放 → 制动结束。

## 09 能耗制动（直流入定子，时间继电器控制）

![09](a09.png)

**它干什么：** 切断交流电源后，立即向定子绕组**通入直流电流**，产生一个固定不动的磁场；转子在里头转动会感应电流、受到与转向相反的力 → 把转子的动能变成电能消耗掉 → 平稳、准确地停车。电路分三部分：主电路、控制电路、**整流电路**。

**器件：** KM1（运行）、KM2（制动，接通直流）、KT（控制制动时间）、SB1（复合按钮）、SB2（启动）、控制变压器 T + 整流桥 + 可调电阻 RP（调制动电流大小 = 调制动力矩）。

**主电路：** KM1 主触点 → FR → 电机。整流电路：交流 → 变压器 T → 整流桥 → 直流 → 经 **⑫** KM2 的主触点和 RP 送进电机任意两相绕组。交流和直流**不能同时**接入。

**控制电路（FR 常闭 **①** 之后分三路）：**

- **②** SB1 常闭 → **③** SB2 启动 ∥ **⑤** KM1 自锁 → **⑦** KM2 常闭（互锁）→ **⑨** KM1 线圈
- **④** SB1 常开（同一个按钮）→ 节点 → **⑥** KT 延时断开的常闭 → **⑧** KM1 常闭（互锁）→ **⑩** KM2 线圈
- **⑪** KT 线圈也从这个节点引出（和下面那一路并联）

**为什么这么接：** 按 SB1 → 常闭**先断** KM1（切断交流电源）→ 常开**后合** → KT 和 KM2 **同时**得电 → KM2 主触点把直流送入定子 → 制动；时间一到 → KT 的延时常闭**⑥** 断开 → KM2 释放 → 制动**自动结束**。**⑦⑧** 两对互锁保证交、直流不同时接入。

**全过程：** 按 SB2 → KM1 吸合自锁，电机运行。停车按 SB1 → KM1 释放（脱离交流）→ KM2、KT 得电 → 直流入定子 → 制动 → KT 时间到 → KM2 释放 → 结束。

## 10. 一张表横向对比

| 电路 | 关键电器 | 自锁 | 互锁 | 一句话原理 |
|---|---|---|---|---|
| 01 过载保护正转 | KM、FR、SB1/SB2 | KM常开并SB2 | 无 | 自锁保持；FR 热元件在主电路、常闭触点在控制电路 |
| 02 双重互锁正反转 | KM1、KM2 | 各自并各自启动按钮 | 对方常闭串本方线圈 + 对方按钮常闭 | 对调两相=反转；两接触器不能同时吸合 |
| 03 自动往返 | + SQ1、SQ2、SQ3、SQ4 | 同上 | 同上 | 撞块碰行程开关：动断先断本方，动合后合对方；SQ3/SQ4 极限保护 |
| 04 自耦降压启动 | KM1、KM2、KT、KA、T、HL | KM1、KA | KM1/KM2 | 启动经变压器抽头降压，KT 到时由 KA 切换到全压 |
| 05 按钮 Y—△ | KM、KMY、KM△、SB2 复合按钮 | KM、KM△ | KMY/KM△ | 星形启动电流为 1/3；按钮先断星形后合三角形 |
| 06 时间继电器 Y—△ | KM、KMY、KM△、KT | KM、KM△ | KMY/KM△ | KT 延时断开常闭断 KMY，延时闭合常开通 KM△ |
| 07 机械制动 | KM + 电磁抱闸 | KM | 无 | 抱闸线圈并在 KM 之后的电机两相上：有电松闸、断电抱闸 |
| 08 反接制动 | KM1、KM2、SR、R、SB1 复合按钮 | KM1 | KM1/KM2 | 对调两相反接制动，电阻限流，转速小于 120 转/分由 SR 断开 |
| 09 能耗制动 | KM1、KM2、KT、T、整流桥、RP、SB1 复合按钮 | KM1 | KM1/KM2 | 切交流通直流，KT 控制制动时间 |

三种降压启动对比：**Y—△** 最简单便宜，启动电流/转矩均为 1/3，只适合三角形接法电机、轻载启动；**自耦变压器** 抽头可选、启动转矩较大，适合较大容量电机，但设备贵。

三种制动对比：**机械制动** 靠闸瓦摩擦，断电也能制动（能保持位置）；**反接制动** 力矩大、停得快，但冲击大、耗能大，要串限流电阻，要速度继电器防止反转；**能耗制动** 平稳准确，需要整流装置，制动时间由时间继电器控制。

## 11. 考前 20 句 + 自测

**20 句必背：**
1. 自锁：接触器通电后，用自身辅助常开触点保持线圈通电；接法是**并联在启动按钮两端**。
2. 互锁：把对方接触器的常闭触点**串联在本方线圈回路**；双重互锁 = 接触器互锁 + 按钮互锁。
3. 热继电器：热元件串主电路，常闭触点串控制电路；双金属片受热弯曲推动触点断开。
4. 电动机反转：对调任意两根电源线。
5. 复合按钮/行程开关动作顺序：动断先断，动合后合。
6. 行程开关 SQ3、SQ4：SQ1、SQ2 失灵时的极限（终端）保护。
7. 自耦变压器降压启动用于较大容量电机；电路由主电路、控制电路、指示电路组成。
8. 中间继电器 KA 在 04 里的作用：切换——断开启动接触器 KM1，接通运行接触器 KM2。
9. 指示灯：HL1 电源、HL2 降压启动、HL3 全压运行。
10. Y—△ 启动只适用于三角形接法的电动机。
11. Y—△ 启动时每相电压降为 1/√3，启动电流、启动转矩降为直接启动的 1/3。
12. KMY 把 U2 V2 W2 短接成星形；KM△ 把 U2 V2 W2 接成三角形；两者必须互锁。
13. 时间继电器两对延时触点：延时断开的常闭串在 KMY 里，延时闭合的常开串在 KM△ 里。
14. 电磁抱闸组成：电磁线圈、衔铁、杠杆（闸瓦、闸轮、弹簧）；通电松闸，断电抱闸。
15. 抱闸线圈并接在 KM 主触点之后的电机两相上。
16. 反接制动：停止后立即对调两根电源线；反转电路串电阻是为了减小过大的反接电流。
17. 速度继电器：转速大于 120 转/分常开闭合，小于 120 转/分断开，制动自动结束。
18. 能耗制动：切断交流后立即向定子绕组通入直流；电路由主电路、控制电路、整流电路组成。
19. 能耗制动时间长短由时间继电器控制。
20. 所有控制回路：停止按钮用常闭、串联；启动按钮用常开、与自锁触点并联；线圈接在最后。

**自测（先遮住答案）：**
1. 松开启动按钮后接触器仍保持吸合，叫什么？靠哪个触点？ → 自锁；接触器自身的辅助常开触点，并联在启动按钮两端。
2. 正反转电路中，KM1 的常闭触点应接在哪？ → 串联在 KM2 的线圈回路里（反之亦然）。
3. 按停止按钮后电机不停，可能是什么原因？ → 自锁触点（或启动按钮）短路、粘连；停止按钮常闭触点被短路；接触器铁芯面有油污粘住不释放。
4. 按启动按钮接触器不吸，可能原因？ → 熔断器熔断、FR 常闭未复位、停止按钮接触不良、线圈断线、互锁触点接触不良。
5. 工作台到了位置不停也不返回，可能原因？ → 相应行程开关坏了；最终由 SQ3/SQ4 断开起到保护。
6. 05 里按下 SB2 后电机停了，为什么？ → SB2 常闭断开了 KMY，而 KM△ 没吸合（KMY 常闭接触不良或 KM△ 回路有断点）。
7. 06 里时间到了电机仍然是星形，为什么？ → KT 延时触点没动作（KT 线圈没得电或整定时间不对）或 KM△ 回路断。
8. 反接制动结束后电机反转起来，为什么？ → 速度继电器触点没有断开（SR 失灵），KM2 没释放。
9. 能耗制动结束后直流仍通着，为什么？ → KT 延时断开常闭触点没断开或 KM2 铁芯粘住。

## 12. 旁白原文（语音转文字整理稿）

**01：** 电路由主电路和控制电路两部分组成。合上电源开关 QS，电源引入。按下 SB2，控制电路中 KM 线圈通电，控制电路中 KM 动合辅助触点闭合，给松开 SB2 后 KM 线圈仍然通电提供了回路。这种接触器通电后仍能自动保持动作后的状态的方法，称为自锁。同时主电路中 KM 动合主触点闭合，电动机通电转动。停止电动机工作，只需按下 SB1 即可。电路中 FR 是一个热继电器，它可以对电动机进行过载保护。热继电器的热元件串接在主电路中，其动断触点串接在控制电路中。当发生过载故障时，电动机定子绕组中的电流会大大增加超过额定值，过大电流所产生的热量会使热继电器的双金属片弯曲，从而推动其动断触点断开，切断控制电路，避免电动机因长时间过载而烧毁。

**02：** 工作时合上电源开关 QS，电源引入。正转工作时，按下 SB2，SB2 的动断触点先断开反转电路，实现按钮互锁。然后 SB2 动合触点闭合，KM1 线圈通电，其动断触点先断开反转电路，实现接触器互锁。而后 KM1 动合辅助触点闭合，实现自锁，动合主触点闭合电动机通电正转。反转工作时可直接按下 SB3。反转控制电路与正转控制电路完全相同，请自行分析。停止电动机工作时，只需按下 SB1 即可。

**03：** 在某些机床设备上，往往要求电动机带动工作台能自动往返运行。解决的方法是，在往返的限定位置安装行程开关，用运动部件的撞块使行程开关动作，接通或断开控制电路，实现电动机正反转的自动转换。我们设定电动机正转工作台右移，反转则工作台左移。工作时，若需右移，则按下 SB2，KM1 线圈通电，其动断触点断开反转电路，实现互锁，动合辅助触点闭合，实现自锁，动合主触点闭合，电动机正转。工作台右移，到达限定位置时，撞动行程开关 SQ2，SQ2 动断触点先断开正转控制电路，然后动合触点闭合接通反转电路，电动机反转。SQ2 复位，工作台左移控制电路与右移控制电路完全相同，请自行分析。电路中的 SQ3 和 SQ4 是为了防止 SQ1、SQ2 失灵工作台越位而设的极限保护。如 SQ2 失灵，工作台撞上 SQ4，可断开右移电路。

**04：** 自耦变压器降压启动方法常用来启动较大容量的三相交流电动机。电路由主电路、控制电路和指示电路三部分组成。工作时，合上电源开关 QS，电源引入，指示灯 HL1 亮。启动时按下 SB2，KM1 线圈通电，KM1 动断辅助触点先断开全压运行电路和电源指示电路，实现互锁。KM1 的四个动合辅助触点闭合：其一实现自锁，使 KT 线圈通电开始计时；其二接通 HL2 的电路，降压运行指示灯 HL2 亮；其三使自耦变压器星接；KM1 动合主触点闭合，电动机串入自耦变压器降压启动。时间继电器计时时间到，其动合触点闭合，KA 线圈通电，其动断触点断开启动电路和降压运行指示电路，实现互锁；动合触点闭合实现自锁，并使 KM2 线圈通电。KM2 通电后，其动合主触点闭合，电动机全压运行；动合辅助触点闭合，接通 HL3 的电路，全压运行指示灯 HL3 亮。停止工作，按下 SB1 即可。

**05：** 电动机星、角降压启动控制电路，是解决电动机启动电流过大的常用方法之一。这种方法只适用于三角形接法的电动机。其工作原理是，在电动机启动时，将定子绕组接成星形降压启动，启动结束后，再将定子绕组接成三角形全压运行。工作时，合上电源开关 QS，电源引入。按下 SB2，KM 和 KM星 线圈通电，KM星的动断触点先断开 KM角的控制电路实现互锁，然后其动合主触点闭合，将电动机定子绕组接成星形。KM 的动合辅助触点闭合自锁，动合主触点闭合，电动机星形接法降压启动。当启动结束时，按下 SB3，SB3 的动断触点先断开 KM星的控制电路，动合触点闭合，接通 KM角的控制电路。KM角线圈通电，KM角动断辅助触点断开 KM星的电路实现互锁，KM角动合触点闭合自锁，动合主触点闭合，电动机三角形接法，全压运行。停止工作时，按下 SB1 即可。

**06：** 这种方法只适用于三角形接法的电动机。其工作原理是，在电动机启动时，将定子绕组接成星形降压启动，启动结束后，再将定子绕组接成三角形全压运行。工作时，合上电源开关 QS，电源引入，按下 SB2，KM、KT 和 KM星 线圈通电，KM星的动断辅助触点先断开 KM角的电路实现互锁，KM 的动合辅助触点闭合自锁，KM 的动合主触点闭合，KM星的动合主触点闭合，电动机定子绕组星形接法启动。时间继电器通电后，进行启动过程计时，计时时间到，其动断触点先断开，使 KM星的线圈断电；其动合触点闭合，使 KM角的线圈通电，KM角的动断触点先断开 KM星的电路，实现互锁，然后其动合主触点闭合，将电动机定子绕组接成三角形全压运行。停止工作时，按下 SB1 即可。

**07：** 所谓机械制动是指利用机械装置，使电动机切断电源后立即停转。目前广泛使用的机械制动装置是电磁抱闸。电磁抱闸的结构主要由电磁线圈、衔铁、闸瓦和闸轮组成。当线圈处于通电状态时，闸瓦松开闸轮；当线圈处于断电状态时，闸瓦抱紧闸轮。工作时，合上电源开关 QS，电源引入，按下 SB2，控制电路中 KM 线圈通电，控制电路中 KM 辅助动合触点闭合自锁。同时，主电路中 KM 动合主触点闭合。在 KM 动合主触点闭合的同时，电磁抱闸的线圈通电，松开闸瓦，电动机转动。如果运行中突然停电或按下停止按钮 SB1，电磁抱闸的线圈断电，闸瓦能立即抱紧闸轮，使电动机迅速停转。

**08：** 运行中的电动机在切断电源后，由于惯性的作用不能立即停下来。对于要求尽快停车的生产机械，就需要采取制动措施。反接制动的原理是，电动机停止正常正转运行后，立即对调两根电源线，使电动机反转，产生制动力矩，达到尽快停车的目的。工作时，合上电源开关 QS，电源引入，按下 SB2，KM1 线圈通电，KM1 动断触点断开 KM2 的电路，实现互锁，KM1 动合触点闭合自锁，KM1 动合主触点闭合，电动机正转运行。当电动机转速大于每分钟 120 转时，速度继电器动合触点闭合。结束工作时，按下 SB1，SB1 的动断触点断开 KM1 的电路，电动机正转断电，SB1 动合触点闭合，KM2 线圈通电，KM2 动断触点断开 KM1 的电路，实现互锁，KM2 动合触点闭合。反转电路中串入电阻，是为了减小过大的反接电流。当正反转矩相互抵消，电动机转速小于每分钟 120 转时，速度继电器动合触点断开，制动结束。

**09：** 能耗制动的原理是，在切断交流电源后，立即将直流电通入电动机定子绕组，产生制动力矩，使电动机尽快停车。电路由主电路、控制电路和整流电路三部分组成。工作时，合上电源开关 QS，电源引入。电动机工作时按下 SB2，KM1 线圈通电，其动断触点先断开 KM2 的电路实现互锁，然后 KM1 动合触点闭合自锁，KM1 动合主触点闭合，电动机运行。停止工作时，按下 SB1，SB1 的动断触点先断开 KM1 的电路，使电动机脱离交流电源，SB1 的动合触点闭合，使 KM2 和时间继电器 KT 线圈通电。KM2 动断触点先断开 KM1 的电路，实现互锁，然后 KM2 动合触点闭合，KM2 动合主触点闭合，整流电路工作，将直流电送入电动机定子绕组，产生制动力矩。制动过程时间的长短由时间继电器控制，定时时间到，时间继电器动作，其动断触点断开，能耗制动结束。
</script>

<script>
(function () {
  function esc(s) {
    return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }
  function inline(s) {
    return esc(s)
      .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
      .replace(/`([^`]+)`/g, "<code>$1</code>");
  }
  function isItem(s) {
    return /^\d{1,2}\. /.test(s);
  }
  function convert(md) {
    var lines = md.split("\n");
    var out = [];
    var para = [];
    var first = true;
    function flush() {
      if (para.length) {
        out.push("<p>" + para.map(inline).join("<br>") + "</p>");
        para = [];
      }
    }
    for (var i = 0; i < lines.length; ) {
      var s = lines[i].trim();
      if (s.indexOf("```") === 0) {
        flush();
        i += 1;
        var code = [];
        while (i < lines.length && lines[i].trim().indexOf("```") !== 0) {
          code.push(lines[i]);
          i += 1;
        }
        out.push("<pre><code>" + esc(code.join("\n")) + "</code></pre>");
        i += 1;
        continue;
      }
      if (s.indexOf("|") === 0) {
        flush();
        var rows = [];
        while (i < lines.length && lines[i].trim().indexOf("|") === 0) {
          rows.push(
            lines[i]
              .trim()
              .replace(/^\|/, "")
              .replace(/\|$/, "")
              .split("|")
              .map(function (c) {
                return c.trim();
              })
          );
          i += 1;
        }
        var t = "<table><tr>" + rows[0].map(function (c) {
          return "<th>" + inline(c) + "</th>";
        }).join("") + "</tr>";
        for (var k = 2; k < rows.length; k += 1) {
          t += "<tr>" + rows[k].map(function (c) {
            return "<td>" + inline(c) + "</td>";
          }).join("") + "</tr>";
        }
        out.push(t + "</table>");
        continue;
      }
      var im = s.match(/^!\[(.*)\]\((.*)\)$/);
      if (im) {
        flush();
        if (/^a0[1-9]\.png$/.test(im[2])) {
          out.push('<img src="img/' + im[2] + '" alt="' + esc(im[1]) + '">');
        }
        i += 1;
        continue;
      }
      if (s.indexOf("# ") === 0) {
        flush();
        out.push("<h1>" + inline(s.slice(2)) + "</h1>");
      } else if (s.indexOf("## ") === 0) {
        flush();
        out.push("<h2" + (first ? ' class="first"' : "") + ">" + inline(s.slice(3)) + "</h2>");
        first = false;
      } else if (s.indexOf("### ") === 0) {
        flush();
        out.push("<h3>" + inline(s.slice(4)) + "</h3>");
      } else if (s === "---") {
        flush();
        out.push("<hr>");
      } else if (s.indexOf("> ") === 0) {
        flush();
        out.push("<blockquote>" + inline(s.slice(2)) + "</blockquote>");
      } else if (s.indexOf("- ") === 0) {
        flush();
        out.push("<ul>");
        while (i < lines.length && lines[i].trim().indexOf("- ") === 0) {
          out.push("<li>" + inline(lines[i].trim().slice(2)) + "</li>");
          i += 1;
        }
        out.push("</ul>");
        continue;
      } else if (isItem(s)) {
        flush();
        out.push("<ol>");
        while (i < lines.length && isItem(lines[i].trim())) {
          out.push("<li>" + inline(lines[i].trim().replace(/^\d{1,2}\. /, "")) + "</li>");
          i += 1;
        }
        out.push("</ol>");
        continue;
      } else if (s === "") {
        flush();
      } else {
        para.push(s);
      }
      i += 1;
    }
    flush();
    return out.join("\n");
  }
  var source = document.getElementById("md");
  document.getElementById("content").innerHTML = convert(source.textContent.replace(/^\n/, ""));
  document.documentElement.setAttribute("data-rendered", "yes");
})();
</script>
</body>
</html>
